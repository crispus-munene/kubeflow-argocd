apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kfam
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: v1.8.0
    path: apps/profiles/upstream/overlays/kubeflow 
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
