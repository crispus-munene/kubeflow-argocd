apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-pipelines
  namespace: argocd
spec:
  project: default
  source:
    # Point directly at the official KFP repo and path — no local kustomization needed
    repoURL: https://github.com/kubeflow/pipelines
    targetRevision: 2.2.0
    path: manifests/kustomize/env/platform-agnostic-pns
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # Required for Kubeflow's large manifests